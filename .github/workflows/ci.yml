name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxi-dev

      - name: Install Raylib from Source (Pinned 5.0 Release)
        run: |
          git clone --depth 1 --branch 5.0 https://github.com/raysan5/raylib.git
          cd raylib/src
          make PLATFORM=PLATFORM_DESKTOP -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile All Targets (nbody_sim, astro_tui, astro_view, test_hpc)
        run: cmake --build build -j$(nproc)

      - name: Run HPC Test Suite via CTest
        run: ctest --test-dir build --output-on-failure

      - name: Run Headless Engine Sanity Check
        run: ./build/nbody_sim -n 512 -s 20 --compare

      - name: Verify Snapshot Export Pipeline
        run: ./build/nbody_sim -n 128 -s 10 --dump /tmp/ci_snapshots --dump-interval 2
